<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact Yetim Vakfı × COP31 — address, phone, email, maps and official form.">
<title>Contact • Yetim Vakfı × COP31</title>
<link rel="stylesheet" href="site-theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.hero{background:linear-gradient(135deg,#0b3d3f,#0d7377 70%,#059669);color:#fff;padding:34px 0 26px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.hero h1{font-size:24px}
.hero p{opacity:.93;font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px 0 10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.07);border-top:5px solid #0d7377}
.card .ico{font-size:32px}
.card h2{font-size:16px;margin:8px 0 4px}
.card p{font-size:14px;color:#374151;word-break:break-word}
.card a.btn{display:inline-block;margin-top:10px;background:#059669;color:#fff;text-decoration:none;font-weight:bold;font-size:13.5px;padding:9px 18px;border-radius:10px}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
<h1 id="title">İletişim</h1>
<p id="subtitle"></p>
<div class="pills">
<button class="pill on" data-l="0">Türkçe</button>
<button class="pill" data-l="1">English</button>
<button class="pill" data-l="2">فارسی</button>
</div>
</div></div>
<div class="wrap">
<div class="grid" id="grid"></div>
<footer class="backline"><a href="index.html" id="back">← Ana Sayfa</a></footer>
</div>
<script>
var UI=[
{t:"İletişim",s:"Bize ulaşın — tüm bilgiler yetimvakfi.org.tr'den doğrulandı.",back:"← Ana Sayfa"},
{t:"Contact",s:"Reach us — all info verified from yetimvakfi.org.tr.",back:"← Home"},
{t:"تماس با ما",s:"با ما در تماس باشید — همه اطلاعات از yetimvakfi.org.tr تأیید شده.",back:"← خانه"}
];
var CARDS=[
{ico:"📍",t:["Ziyaret","Visit","نشانی"],v:["Dervişali, Kariye Cami Sk. No:6, 34087 Fatih/İstanbul","Dervişali, Kariye Cami Sk. No:6, 34087 Fatih/Istanbul","درویش‌علی، کوچه مسجد کاریه ۶، فاتح/استانبول"],b:["Haritada Aç","Open in Maps","باز کردن نقشه"],url:"https://maps.app.goo.gl/G7xEt7ZmWxuf5hQf9"},
{ico:"☎️",t:["Telefon","Call","تلفن"],v:["0212 970 60 60"," +90 212 970 60 60","0212 970 60 60"],b:["Hemen Ara","Call Now","تماس"],url:"tel:+902129706060"},
{ico:"✉️",t:["E-posta","Email","ایمیل"],v:["info@yetimvakfi.org.tr","info@yetimvakfi.org.tr","info@yetimvakfi.org.tr"],b:["E-posta Gönder","Send Email","ارسال ایمیل"],url:"mailto:info@yetimvakfi.org.tr"},
{ico:"📝",t:["İletişim Formu","Contact Form","فرم تماس"],v:["Sorularınız için resmi formu kullanın.","Use the official form for your questions.","برای سؤالاتتان از فرم رسمی استفاده کنید."],b:["Formu Aç","Open Form","باز کردن فرم"],url:"https://yetimvakfi.org.tr/iletisim"},
{ico:"🌍",t:["COP31 Green Zone","COP31 Green Zone","گرین‌زون COP31"],v:["9–20 Kasım 2026 • Antalya EXPO Center","9–20 Nov 2026 • Antalya EXPO Center","۹ تا ۲۰ نوامبر ۲۰۲۶ • آنتالیا EXPO"],b:["cop31.tr →","cop31.tr →","cop31.tr ←"],url:"https://cop31.tr/green-zone"},
{ico:"🌙",t:["Aya Asistan","Aya Assistant","دستیار آیا"],v:["7/24 çevrimiçi — sorularınızı yanıtlar.","Online 24/7 — answers your questions.","۲۴ ساعته آنلاین — به سؤالاتتان جواب می‌دهد."],b:null,url:null}
];
var HELP=[["Sağ alttaki 🌙 düğmeye dokunun.","Tap the 🌙 button, bottom-right.","دکمه 🌙 پایین-راست را بزنید."]];
var lang=0;
function render(){
document.body.className=lang===2?"rtl":"";
var u=UI[lang];
document.getElementById("title").textContent=u.t;
document.getElementById("subtitle").textContent=u.s;
document.getElementById("back").textContent=u.back;
var h="";
CARDS.forEach(function(c,i){
var btn=c.b?'<a class="btn" href="'+c.url+'"'+(c.url.indexOf("http")===0?' target="_blank" rel="noopener"':"")+">"+c.b[lang]+"</a>":'<p style="margin-top:10px;font-weight:bold;color:#0d7377">'+HELP[0][lang]+"</p>";
h+='<div class="card"><div class="ico">'+c.ico+"</div><h2>"+c.t[lang]+"</h2><p>"+c.v[lang]+"</p>"+btn+"</div>";
});
document.getElementById("grid").innerHTML=h;
var pills=document.querySelectorAll(".pill");
for(var i=0;i<pills.length;i++){pills[i].className="pill"+(parseInt(pills[i].getAttribute("data-l"))===lang?" on":"");}
}
var pl=document.querySelectorAll(".pill");
for(var a=0;a<pl.length;a++){pl[a].onclick=function(){lang=parseInt(this.getAttribute("data-l"));render();};}
render();
</script>
<script src="site-nav.js"></script>
<script src="site-translate.js"></script>
<script src="aya-widget.js"></script>
<script src="site-debug.js"></script>
</body>
</html>
